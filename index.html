<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Nyx OS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="nyxWorld">
        
        <div id="fog"></div>
    </div>
    
    <div id="titleContainer">
     
        
        <h1>Nyx OS</h1>
        <p>Your AI assistant</p>
    
    </div>
    <div id="statusBar">
        🌙 Online | 🧠 Memory Active | ✨ Mood: Normal
    </div>
    <div id = "alltools"> <button id = "notes" title="Library">📜</button> <button id = "tasks">Tasks</button> <button id = "tools">Tools</button></div>
    <div id = "notespage" class="panelhide"> <div class = "panelheader"><h1 id="notehead"> Whispers (0) </h1> <button id = "closenotes"> Close </button> </div>
    <input id="noteTitle" type="text" placeholder="Title">
    <textarea id = "noteInput" placeholder="Write your thoughts..."></textarea>
    <button id = "savethem">Save</button>
    <input id="searchnotes" type="text" placeholder="Search Notes">
    <div id = "noteslist"></div> </div>

    <div id = "missionpage" class = "panelhide">

        <div class = "panelheader">
            <h1 id = "missionhead">Missions (0)</h1>
            <button id = "closemission">Close</button>
        </div>
        <input id = "missioninput" type = "text" placeholder="New Mission"> 
        <input id="missionCata" type="text" placeholder="Category">
        <input id="missionDue" type="date">
        <select id = "missionPriority">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
            <option value="critical">Critical</option> 
        </select>
        <button id = "savetask"> Save Mission</button>
        <div id = "missionlist"></div>
        <p id = "missionProgress">
            Completed 0/0
        </p>

        <div id = "progressBar">
            <div id = "progressFill"></div>
        </div>
    </div>

    <div class = "pc-card"> <h2> Connect PC </h2>
    <p id = "PC-Status">
        Status: Not connected
    </p>

    <button id = "Connect" class="hidden">
    </button>
    <div class="PC-Info">
        <p>Name: </p>
        <p>Last Seen: </p>
        <p>Companion installed: No</p>
     </div>   
    
    
    </div>
    <div id="chatBox"></div>
    <input id="userInput" type="text" placeholder="talk to Nyx">
    <button id="sendBtn">Send</button>
    <div id="scrollLabel"></div>
    <div id="scrollLib" style="display: none;">
        <button id="closeLib" style="position: fixed; top: 20px; right: 20px; z-index: 2001; padding: 10px 16px; background: #a22; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 18px;">X</button>
        <div id="scrollContent">
            <input id="scrollTitleInput" type="text" placeholder="Title">
            <div id="scrollDivide"></div>
            <textarea id="scrollWriting" placeholder="Write here..."></textarea>
            <button id="scrollSave">Save</button>
            <button id="scrollDelete">Delete</button>
        </div>
        </div>
            <script type="module" src="scene.js"></script>
    <script type="module" src="scroll.js"></script>
    <script src="script.js"></script>


  
</body>
</html>
