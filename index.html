<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Nyx OS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="nyxWorld">
        <div id="stars"></div>
        <div id="mountains"></div>
        <div id="fog"></div>
    </div>
    
    <div id="titleContainer">
        <div id="moon"></div>
        
        <h1>Nyx OS</h1>
        <p>Your AI assistant</p>
    
    </div>
    <div id="statusBar">
        🌙 Online | 🧠 Memory Active | ✨ Mood: Normal
    </div>
    <div id = "alltools"> <button id = "notes" >Notes</button> <button id = "Tasks">Tasks</button> <button id = "tools">Tools</button></div>
    <div id = "notespage" class="panelhide"> <div class = "panelheader"><h1> Notes </h1> <button id = "closenotes"> Close </button> </div>

    <div id = "noteslist"></div> </div>
    <div class = "pc-card"> <h2> Connect PC </h2>
    <p id = "PC-Status">
        Status: Not connected
    </p>
    <button id = "Connect" class="hidden">//hidden it coz it was annoying me and that feature will be added later maybe
        Connect PC
    </button>
    <div class="PC-Info">
        <p>Name: </p>
        <p>Last Seen: </p>
        <p>Companion installed: No</p>
     </div>   
    
    
    </div>
    <div id="chatBox"></div>
    <input id="userInput" type="text" placeholder="talk to Nyx">
    <button id="sendBtn">Send</button>
    <script type="module" src="scene.js"></script>
    <script src="script.js"></script>


  
</body>
</html>
